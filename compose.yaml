services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: yoyo
      POSTGRES_PASSWORD: yoyo_local
      POSTGRES_DB: yoyo
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoyo"]
      interval: 2s
      timeout: 3s
      retries: 30
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: local@yoyo.dev
      PGADMIN_DEFAULT_PASSWORD: yoyo_local
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports: ["127.0.0.1:5050:80"]
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./infra/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres:
  pgadmin:
